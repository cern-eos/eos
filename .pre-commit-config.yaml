fail_fast: false
# Unchanged copies of upstream code
exclude: ^test/bats/vendor/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
#      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  #  # Disable for now and use clang-format-diff.py instead to only format changed lines.
  #  - repo: https://github.com/pocc/pre-commit-hooks
  #    rev: v1.3.5
  #    hooks:
  #      - id: clang-format
  #        name: clang-format
  #        types_or: [ c, c++ ]
  #        args:
  #          - -i
  #    stages: [ manual ]

  - repo: local
    hooks:
      - id: clang-format-diff
        name: clang-format-diff
        # We pipe 'git diff' to the python script.
        # -p1 strips the a/ b/ prefixes from the diff so the script finds the files.
        # -i applies the edits in-place.
        # ':(exclude)*.proto' drops .proto files from the diff: clang-format-diff.py
        # matches them by default but clang-format hard-errors on Proto unless the
        # .clang-format config declares a Proto style, which it does not.
        entry: bash -c 'git diff -U0 --no-color --cached -- . ":(exclude)*.proto" | python3 utils/clang-format-diff.py -p1 -i'
        language: system
        types_or: [ c, c++ ]
        pass_filenames: false
      # The tests of the BATS helpers, no EOS instance needed (about 5 s)
      - id: bats-selftest
        name: bats-selftest
        entry: bash -c '[ -x test/bats/vendor/bats-core/bin/bats ] || { echo "no bats, run git submodule update --init test/bats/vendor"; exit 1; }; test/bats/vendor/bats-core/bin/bats test/bats/selftest.bats'
        language: system
        files: ^test/bats/(eos|runtest)\.bash$|^test/bats/selftest\.bats$
        pass_filenames: false
      # shellcheck for the BATS framework and suites only, not for the old
      # test scripts. Skipped when shellcheck is not installed (EPEL: ShellCheck).
      # Excluded: variables of other loaded files (SC2154, SC2034), and the word
      # splitting that the suites use on purpose (SC2046, SC2048, SC2068).
      - id: shellcheck
        name: shellcheck
        entry: bash -c 'command -v shellcheck >/dev/null || { echo "shellcheck is not installed, skipped"; exit 0; }; shellcheck --shell=bash --severity=warning --exclude=SC2154,SC2034,SC2046,SC2048,SC2068 "$@"' --
        language: system
        files: ^test/(bats/[^/]+|[^/]+/[^/]+|[^/]+/[^/]+/[^/]+)\.(bash|bats)$|^test/eos-bats-test$
