# Root pipeline definition. All concrete jobs live in topic-specific files
# pulled in via `include:` below. Shared infrastructure (stages, defaults,
# workflow rules, reusable rule fragments) stays here.

stages:
  - build:manual
  - pre-commit
  - prebuild
  - build:rpm
  - build:dockerimage
  - test
  - publish
  - clean

variables:
  CODENAME: "diopside"
  # Job set named in the pipeline title; MR pipelines without the
  # run-full-ci label override it in the workflow rules
  PIPELINE_SCOPE: "full"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 8
  CCACHE_POLICY: pull-push
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fastest
  ARTIFACT_COMPRESSION_LEVEL: fastest
  # Eight configurable instance queues share four resource groups by default.
  EOS_K8S_QUEUE_1: "eos-ci-k8s-1"
  EOS_K8S_QUEUE_2: "eos-ci-k8s-2"
  EOS_K8S_QUEUE_3: "eos-ci-k8s-3"
  EOS_K8S_QUEUE_4: "eos-ci-k8s-4"
  EOS_K8S_QUEUE_5: "eos-ci-k8s-2"
  EOS_K8S_QUEUE_6: "eos-ci-k8s-4"
  EOS_K8S_QUEUE_7: "eos-ci-k8s-4"
  EOS_K8S_QUEUE_8: "eos-ci-k8s-2"
  # RPM payload codec for dev builds: zstd-3 is much faster than the default xz
  # for a marginally larger package. Cleared for tag builds (see workflow rules)
  # so published release RPMs keep the smaller default compression.
  RPM_BINARY_PAYLOAD: "w3.zstdio"
  # Stop a hung script before the 2 h job timeout: after_script then still
  # runs, deletes the k8s namespace and uploads the logs
  RUNNER_SCRIPT_TIMEOUT: 1h45m
  RUNNER_AFTER_SCRIPT_TIMEOUT: 10m

default:
  interruptible: true
  image: gitlab-registry.cern.ch/linuxsupport/alma9-base
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  # Show in the pipeline list which job set runs (see .rules-full-ci)
  name: '[$PIPELINE_SCOPE] $CI_COMMIT_TITLE'
  auto_cancel:
    on_new_commit: interruptible

  rules:
    # Scheduled pipelines always run (don't evaluate file changes for them)
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        KOJI_SCRATCH: "--scratch"
    # Tag pipelines always run
    - if: '$CI_COMMIT_TAG'
      variables:
        KOJI_SCRATCH: ""
        CCACHE_POLICY: push
        RPM_BINARY_PAYLOAD: ""
    # Merge request pipelines. MR labels map to a job set here, and only here:
    # jobs test $PIPELINE_SCOPE, never the labels. To add a label, or combine
    # labels, see "CI job sets and merge request labels" in
    # doc/diopside/manual/develop.rst.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)run-full-ci(,|$)/'
      variables:
        KOJI_SCRATCH: "--scratch"
        PIPELINE_SCOPE: "full"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        KOJI_SCRATCH: "--scratch"
        PIPELINE_SCOPE: "unit + k8s_system"
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
        KOJI_SCRATCH: "--scratch"
    # A push to any other branch creates no pipeline: it would duplicate the MR
    # pipeline, and is usually pushed before the MR exists, so
    # $CI_OPEN_MERGE_REQUESTS cannot catch it. Open a (draft) MR, or start the
    # pipeline by hand ("Run pipeline"), which runs every job.
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger|pipeline)$/'
      variables:
        KOJI_SCRATCH: "--scratch"

#-------------------------------------------------------------------------------
# Shared rule fragments
# Pull these into a job via:  rules: !reference [.rules-..., rules]
#-------------------------------------------------------------------------------
.rules-schedules-and-tags:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'

# build_el9 is the primary platform: unlike el8/el10 (schedule + tag only) it
# runs on every pipeline, starts without waiting on earlier stages (needs: []),
# and only pulls the ccache on scheduled runs so it does not repopulate it.
.rules-build-el9:
  rules:
    - if: '$PREBUILD_TRIGGER'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        CCACHE_POLICY: pull
      needs: []
    - when: on_success
      needs: []

.rules-schedules-and-triggers:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'

.rules-tags-only:
  rules:
    - if: '$CI_COMMIT_TAG'

.rules-manual-on-schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual
      allow_failure: true

.rules-manual:
  rules:
    - when: manual
      allow_failure: true

.rules-schedules-and-tags-manual:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true

.rules-master-and-tags:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'

.rules-tags-manual:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true

# Jobs of the full test set. PIPELINE_SCOPE is "full" on master, tags,
# schedules, manual pipelines and MRs with the run-full-ci label (see the
# workflow rules); other MR pipelines run the builds, unit tests, pre_commit
# and k8s_system.
.rules-full-ci:
  rules:
    - if: '$PIPELINE_SCOPE == "full"'

#-------------------------------------------------------------------------------
# Concrete jobs are split by topic. Hidden templates (.foo) and rule fragments
# defined above are visible across all includes thanks to GitLab merging all
# files into one virtual configuration before evaluation.
#-------------------------------------------------------------------------------
include:
  # - template: Code-Quality.gitlab-ci.yml
  #  - local: /gitlab-ci/.gitlab-ci-test-dock_include.yml @note on the file
  #  - local: /gitlab-ci/.gitlab-ci-build-macos.yml
  - local: /gitlab-ci/.gitlab-ci-prebuild.yml
  - local: /gitlab-ci/.gitlab-ci-build-rhel.yml
  - local: /gitlab-ci/.gitlab-ci-build-ubuntu.yml
  - local: /gitlab-ci/.gitlab-ci-build-dockerimage.yml
  - local: /gitlab-ci/.gitlab-ci-test-unit.yml
  - local: /gitlab-ci/.gitlab-ci-test-dock8s.yml
  - local: /gitlab-ci/.gitlab-ci-test-k8s_include.yml
  - local: /gitlab-ci/.gitlab-ci-test-helm_include.yml
  - local: /gitlab-ci/.gitlab-ci-test-triggers.yml
  - local: /gitlab-ci/.gitlab-ci-publish.yml
  - local: /gitlab-ci/.gitlab-ci-clean.yml
  - local: /gitlab-ci/.gitlab-ci-misc.yml
