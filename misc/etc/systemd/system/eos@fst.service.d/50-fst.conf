# Privileges needed by an FST on top of eos@.service: read access to the block
# devices for IO measurements, S.M.A.R.T. queries through smartctl and the
# real-time IO priority class. FST instances with a different name can use it
# by linking it into their own drop-in directory e.g.
#   mkdir -p /etc/systemd/system/eos@fst1.service.d
#   ln -s /usr/lib/systemd/system/eos@fst.service.d/50-fst.conf \
#     /etc/systemd/system/eos@fst1.service.d/50-fst.conf

[Service]
SupplementaryGroups=disk
AmbientCapabilities=CAP_SYS_ADMIN CAP_SYS_RAWIO
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_SYS_RAWIO
