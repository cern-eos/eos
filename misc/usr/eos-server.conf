# Directories used by the eos@<name> services which are not managed through
# RuntimeDirectory= or LogsDirectory= in eos@.service.
d /var/eos 0755 daemon daemon -
d /var/eos/md 0755 daemon daemon -
d /var/eos/report 0755 daemon daemon -
d /var/eos/stage 0755 daemon daemon -
d /var/eos/auth 0755 daemon daemon -
a+ /var/eos/auth - - - - default:user:daemon:r
d /var/spool/eos 0755 daemon daemon -
d /var/spool/eos/admin 0755 daemon daemon -
z /etc/eos.keytab 0400 daemon daemon -
